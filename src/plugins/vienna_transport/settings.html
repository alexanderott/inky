<div class="form-group">
    <label class="form-label">Monitored Stops:</label>
    <div id="stopsContainer">
        <!-- Stops will be dynamically added here -->
    </div>
    <button type="button" id="addStop" class="action-button compact">Add Stop</button>
</div>

<div class="form-group">
    <label for="refreshInterval" class="form-label">Refresh Interval (seconds):</label>
    <input type="number" id="refreshInterval" name="refreshInterval" class="form-input" min="30" max="300" value="30" />
    <small>Minimum 30 seconds (API fair use policy)</small>
</div>

<script>
let stopCounter = 0;

function createStopElement(stopData = {}) {
    const stopId = stopData.id || `stop_${stopCounter++}`;
    const stopDiv = document.createElement('div');
    stopDiv.className = 'stop-config';
    stopDiv.style.border = '1px solid #ccc';
    stopDiv.style.padding = '10px';
    stopDiv.style.margin = '10px 0';
    stopDiv.style.borderRadius = '5px';
    
    stopDiv.innerHTML = `
        <div class="form-group">
            <label class="form-label">Stop Name:</label>
            <input type="text" name="stops[${stopId}][name]" class="form-input" placeholder="e.g. Praterstern" value="${stopData.name || ''}" />
        </div>
        <div class="form-group">
            <label class="form-label">RBL Number:</label>
            <input type="text" name="stops[${stopId}][rbl]" class="form-input" placeholder="e.g. 4259" value="${stopData.rbl || ''}" />
            <small>Find RBL numbers at <a href="https://till.mabe.at/rbl/" target="_blank">till.mabe.at/rbl</a></small>
        </div>
        <div class="form-group">
            <label class="form-label">Monitor Lines (comma-separated, leave empty for all):</label>
            <input type="text" name="stops[${stopId}][lines]" class="form-input" placeholder="e.g. U1,U2,5A" value="${stopData.lines || ''}" />
        </div>
        <button type="button" class="action-button compact" onclick="removeStop(this)" style="background-color: #dc3545;">Remove Stop</button>
    `;
    
    return stopDiv;
}

function addStop(stopData = {}) {
    const stopsContainer = document.getElementById('stopsContainer');
    const stopElement = createStopElement(stopData);
    stopsContainer.appendChild(stopElement);
}

function removeStop(button) {
    button.parentElement.remove();
}

document.getElementById('addStop').addEventListener('click', () => addStop());

document.addEventListener('DOMContentLoaded', () => {
    if (loadPluginSettings) {
        // Load refresh interval
        document.getElementById('refreshInterval').value = pluginSettings.refreshInterval || 30;
        
        // Load stops
        if (pluginSettings.stops && typeof pluginSettings.stops === 'object') {
            Object.entries(pluginSettings.stops).forEach(([id, stopData]) => {
                addStop({...stopData, id});
            });
        }
    } else {
        // Add one default stop for new configurations
        addStop();
    }
    
    // If no stops were added, add at least one
    if (document.getElementById('stopsContainer').children.length === 0) {
        addStop();
    }
});
</script>

<style>
.stop-config {
    background-color: #f9f9f9;
}

.stop-config .form-group {
    margin-bottom: 8px;
}

.stop-config small {
    color: #666;
    font-size: 0.9em;
}

.stop-config small a {
    color: #007bff;
}
</style>
